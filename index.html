<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photo Bracket Merge</title>
  <!-- GitHub Pages nie ustawia nagłówków COOP/COEP; ten service worker je dodaje,
       bo dekoder RAW (LibRaw WASM) potrzebuje SharedArrayBuffer -->
  <script src="coi-serviceworker.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #222; background: #fff; }
    h1 { font-size: 1.4rem; }
    p.note { color: #666; font-size: 0.9rem; }
    #drop { border: 2px dashed #999; border-radius: 10px; padding: 48px 16px; text-align: center; cursor: pointer; overflow-wrap: anywhere; }
    #drop.over { border-color: #2a6df4; background: #eef3ff; }
    .opts { margin: 16px 0; display: flex; flex-direction: column; gap: 8px; }
    button, a.btn { font: inherit; padding: 10px 18px; border-radius: 8px; border: 0; cursor: pointer; }
    #merge { background: #2a6df4; color: #fff; }
    #merge:disabled { background: #aaa; cursor: default; }
    a.btn { display: inline-block; background: #1a9e55; color: #fff; text-decoration: none; margin-left: 8px; }
    #status { margin-top: 16px; min-height: 1.2em; white-space: pre-line; }
    .error { color: #c0392b; }
  </style>
</head>
<body>
  <h1>Photo Bracket Merge</h1>
  <p class="note">Wszystko liczy się w przeglądarce — zdjęcia nigdzie nie są wysyłane.</p>

  <div id="drop">Upuść tu pliki RAW (ARW, CR2, CR3, NEF, RAF, DNG, ORF, RW2, …) albo kliknij, żeby wybrać</div>
  <input id="picker" type="file" multiple hidden>

  <div class="opts">
    <label>Zdjęć w jednym bracketcie: <input id="group" type="number" min="1" value="3" style="width: 4em"></label>
    <label><input id="lens" type="checkbox"> Korekcja obiektywu (tylko Sony — profil z pliku ARW)</label>
    <label><input id="awb" type="checkbox"> Auto balans bieli</label>
  </div>

  <button id="merge" disabled>Połącz</button>
  <a id="download" class="btn" hidden>Pobierz</a>
  <div id="status"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
