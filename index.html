<!doctype html>
<html lang="pl">
  <head>
    <meta charset="UTF-8" />
    <!-- GitHub Pages nie ustawia nagłówków COOP/COEP; ten service worker je dodaje,
         bo dekoder RAW (LibRaw WASM) potrzebuje SharedArrayBuffer -->
    <script src="%BASE_URL%coi-serviceworker.js"></script>
    <script>
      // Applies the stored/system theme before first paint (no flash).
      ;(function () {
        try {
          var stored = localStorage.getItem("theme")
          var theme =
            stored === "dark" || stored === "light" || stored === "system"
              ? stored
              : "system"
          var resolved =
            theme === "system"
              ? window.matchMedia("(prefers-color-scheme: dark)").matches
                ? "dark"
                : "light"
              : theme
          document.documentElement.classList.add(resolved)
        } catch (e) {}
      })()
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photo Bracket Merge</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
