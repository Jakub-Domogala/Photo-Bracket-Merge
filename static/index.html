<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Photo Bracket Merge</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; color: #222; }
    h1 { font-size: 1.4rem; }
    #drop { border: 2px dashed #999; border-radius: 10px; padding: 48px 16px; text-align: center; cursor: pointer; }
    #drop.over { border-color: #2a6df4; background: #eef3ff; }
    .opts { margin: 16px 0; display: flex; flex-direction: column; gap: 8px; }
    button, a.btn { font: inherit; padding: 10px 18px; border-radius: 8px; border: 0; cursor: pointer; }
    #merge { background: #2a6df4; color: #fff; }
    #merge:disabled { background: #aaa; cursor: default; }
    a.btn { display: inline-block; background: #1a9e55; color: #fff; text-decoration: none; margin-left: 8px; }
    #status { margin-top: 16px; min-height: 1.2em; }
    .error { color: #c0392b; }
  </style>
</head>
<body>
  <h1>Photo Bracket Merge</h1>

  <div id="drop">Upuść tu pliki .ARW albo kliknij, żeby wybrać</div>
  <input id="picker" type="file" accept=".arw,.ARW" multiple hidden>

  <div class="opts">
    <label>Zdjęć w jednym bracketcie: <input id="group" type="number" min="1" value="3" style="width: 4em"></label>
    <label><input id="lens" type="checkbox"> Korekcja obiektywu (profil Sony z ARW)</label>
    <label><input id="awb" type="checkbox"> Auto balans bieli</label>
  </div>

  <button id="merge" disabled>Połącz</button>
  <a id="download" class="btn" hidden>Pobierz</a>
  <div id="status"></div>

  <script>
    const drop = document.getElementById("drop");
    const picker = document.getElementById("picker");
    const mergeBtn = document.getElementById("merge");
    const download = document.getElementById("download");
    const status = document.getElementById("status");
    let files = [];

    function setFiles(list) {
      files = [...list].filter(f => f.name.toLowerCase().endsWith(".arw"));
      drop.textContent = files.length ? `${files.length} plików ARW: ${files.map(f => f.name).join(", ")}`
                                      : "Upuść tu pliki .ARW albo kliknij, żeby wybrać";
      mergeBtn.disabled = !files.length;
      download.hidden = true;
      status.textContent = "";
    }

    drop.onclick = () => picker.click();
    picker.onchange = () => setFiles(picker.files);
    drop.ondragover = e => { e.preventDefault(); drop.classList.add("over"); };
    drop.ondragleave = () => drop.classList.remove("over");
    drop.ondrop = e => { e.preventDefault(); drop.classList.remove("over"); setFiles(e.dataTransfer.files); };

    mergeBtn.onclick = async () => {
      const form = new FormData();
      files.forEach(f => form.append("files", f));
      form.append("group_size", document.getElementById("group").value);
      form.append("lens_correction", document.getElementById("lens").checked ? "1" : "0");
      form.append("auto_wb", document.getElementById("awb").checked ? "1" : "0");

      mergeBtn.disabled = true;
      download.hidden = true;
      status.className = "";
      status.textContent = "Przetwarzanie… (kilka sekund na bracket)";
      try {
        const res = await fetch("/merge", { method: "POST", body: form });
        if (!res.ok) throw new Error((await res.json().catch(() => ({}))).error || res.statusText);
        const name = (res.headers.get("Content-Disposition") || "").match(/filename="?([^";]+)"?/)?.[1] || "merged";
        if (download.href) URL.revokeObjectURL(download.href);
        download.href = URL.createObjectURL(await res.blob());
        download.download = name;
        download.hidden = false;
        status.textContent = `Gotowe: ${name}`;
      } catch (err) {
        status.className = "error";
        status.textContent = `Błąd: ${err.message}`;
      } finally {
        mergeBtn.disabled = false;
      }
    };
  </script>
</body>
</html>
